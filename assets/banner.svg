<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="성석민 — AI Full-Stack Developer">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D97757" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="orb" cx=".85" cy=".1" r=".6">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="type"><rect x="70" y="118" width="0" height="30"><animate attributeName="width" from="0" to="720" dur="2.2s" begin=".3s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    text{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Apple SD Gothic Neo','Noto Sans KR',monospace}
    .dim{fill:#8b949e}.fg{fill:#e6edf3}.ok{fill:#3fb950}.ac{fill:#D97757}
    .step{opacity:0}.step{animation:in .4s forwards}
    @keyframes in{to{opacity:1}}
    .cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  </style>
  <rect width="1200" height="400" rx="20" fill="#0d1117"/>
  <rect width="1200" height="400" rx="20" fill="url(#orb)"/>
  <rect x=".5" y=".5" width="1199" height="399" rx="20" fill="none" stroke="url(#glow)"/>

  <!-- title bar -->
  <circle cx="44" cy="42" r="7" fill="#ff5f56"/><circle cx="68" cy="42" r="7" fill="#ffbd2e"/><circle cx="92" cy="42" r="7" fill="#27c93f"/>
  <text x="600" y="47" text-anchor="middle" font-size="14" class="dim">AI FULL-STACK DEVELOPER</text>

  <!-- prompt -->
  <text x="44" y="140" font-size="22" class="ac">$</text>
  <g clip-path="url(#type)"><text x="70" y="140" font-size="22" class="fg">claude "서비스를 만들고, 출시하고, 운영하며 계속 바꿉니다."</text></g>

  <!-- pipeline -->
  <g font-size="18">
    <text x="70" y="185" class="step" style="animation-delay:2.6s"><tspan class="ok">✓</tspan> <tspan class="fg">plan</tspan></text>
    <text x="170" y="185" class="step" style="animation-delay:3.0s"><tspan class="ok">✓</tspan> <tspan class="fg">critique</tspan></text>
    <text x="305" y="185" class="step" style="animation-delay:3.4s"><tspan class="ac">👤</tspan> <tspan class="fg">approve</tspan></text>
    <text x="440" y="185" class="step" style="animation-delay:3.8s"><tspan class="ok">✓</tspan> <tspan class="fg">implement</tspan></text>
    <text x="600" y="185" class="step" style="animation-delay:4.2s"><tspan class="ok">✓</tspan> <tspan class="fg">review</tspan><tspan class="ac cur"> ▍</tspan></text>
  </g>

  <!-- name -->
  <text x="44" y="272" font-size="56" font-weight="700" class="fg" style="font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">성석민</text>
  <text x="228" y="270" font-size="18" letter-spacing="3" class="ac">PRODUCT ENGINEER</text>

  <!-- bento chips -->
  <g font-size="16">
    <rect x="44" y="305" width="230" height="56" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="64" y="330" class="dim" font-size="12">EXPERIENCE</text><text x="64" y="351" class="fg" font-weight="700">FE 3.5y · BE 1.4y</text>
    <rect x="290" y="305" width="300" height="56" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="310" y="330" class="dim" font-size="12">CORE</text><text x="310" y="351" class="fg" font-weight="700">TypeScript · NestJS · React</text>
    <rect x="606" y="305" width="230" height="56" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="626" y="330" class="dim" font-size="12">WORKS BY</text><text x="626" y="351" class="fg" font-weight="700">설계 → 출시 → 운영</text>
    <rect x="852" y="305" width="200" height="56" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="872" y="330" class="dim" font-size="12">TOOLS</text><text x="872" y="351" class="fg" font-weight="700">Claude Code</text>
  </g>
</svg>
