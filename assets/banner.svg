<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="성석민, AI Full-Stack Developer. How I build with AI: plan, critique, approve, implement, review. 계획을 먼저 공격하고, 훅으로 강제합니다.">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D97757" stop-opacity=".35"/><stop offset="1" stop-color="#7C5CFF" stop-opacity=".25"/></linearGradient>
    <radialGradient id="orb" cx=".85" cy=".06" r=".55"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".35"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
    <clipPath id="type"><rect x="70" y="96" width="0" height="34"><animate attributeName="width" from="0" to="780" dur="2.2s" begin=".3s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
    .mono{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,'Apple SD Gothic Neo','Noto Sans KR',monospace}
    .dim{fill:#8b949e}.fg{fill:#e6edf3}.ok{fill:#3fb950}.ac{fill:#D97757}
    .n{opacity:0;animation:in .5s forwards}
    @keyframes in{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out 5s infinite}
    @keyframes pulse{50%{stroke-opacity:.35}}
  </style>
  <rect width="1200" height="800" rx="20" fill="#0d1117"/>
  <rect width="1200" height="800" rx="20" fill="url(#orb)"/>
  <rect x=".5" y=".5" width="1199" height="799" rx="20" fill="none" stroke="url(#glow)"/>

  <!-- title bar -->
  <circle cx="44" cy="42" r="7" fill="#ff5f56"/><circle cx="68" cy="42" r="7" fill="#ffbd2e"/><circle cx="92" cy="42" r="7" fill="#27c93f"/>
  <text x="600" y="47" text-anchor="middle" font-size="14" class="mono dim">~/SungSeokMin</text>

  <!-- prompt -->
  <text x="44" y="120" font-size="22" class="mono ac">$</text>
  <g clip-path="url(#type)"><text x="70" y="120" font-size="22" class="mono fg">claude "서비스를 만들고, 출시하고, 운영하며 계속 바꿉니다."</text></g>

  <!-- identity -->
  <text x="44" y="200" font-size="56" font-weight="700" class="fg">성석민</text>
  <text x="228" y="198" font-size="18" letter-spacing="3" class="mono ac">AI FULL-STACK DEVELOPER</text>
  <rect x="44" y="235" width="230" height="56" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="260" class="dim" font-size="12">EXPERIENCE</text><text x="64" y="281" class="fg" font-size="16" font-weight="700">FE 3.5y · BE 1.4y</text>
  <rect x="290" y="235" width="300" height="56" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="310" y="260" class="dim" font-size="12">CORE</text><text x="310" y="281" class="fg" font-size="16" font-weight="700">TypeScript · NestJS · React</text>
  <rect x="606" y="235" width="230" height="56" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="626" y="260" class="dim" font-size="12">WORKS BY</text><text x="626" y="281" class="fg" font-size="16" font-weight="700">설계 → 출시 → 운영</text>
  <rect x="852" y="235" width="200" height="56" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="872" y="260" class="dim" font-size="12">TOOLS</text><text x="872" y="281" class="fg" font-size="16" font-weight="700">Claude Code</text>

  <!-- section -->
  <line x1="44" y1="335" x2="1156" y2="335" stroke="#30363d"/>
  <text x="44" y="388" font-size="26" font-weight="700" class="fg"><tspan>🤖</tspan>  How I build with AI</text>
  <text x="44" y="436" font-size="23" class="fg">AI가 쓴 코드도 사람이 쓴 코드처럼 검증을 거치도록,</text>
  <text x="44" y="472" font-size="23" class="fg">에이전트마다 <tspan class="ac" font-weight="700">역할</tspan>을 나누고 사람이 <tspan class="ac" font-weight="700">승인하는 지점</tspan>을 정해 두었습니다.</text>

  <!-- flow -->
  <g transform="translate(-16,341)" class="mono" font-size="21" text-anchor="middle">
    <g class="n" style="animation-delay:2.6s"><rect x="60" y="164" width="180" height="68" rx="16" fill="#161b22" stroke="#30363d"/><text x="150" y="205" class="fg">plan</text></g>
    <path class="n" style="animation-delay:2.8s" d="M246 198h40m-8-8l8 8-8 8" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="n" style="animation-delay:3.0s"><rect x="291" y="164" width="180" height="68" rx="16" fill="#161b22" stroke="#30363d"/><text x="381" y="205" class="fg">critique</text></g>
    <path class="n" style="animation-delay:3.2s" d="M477 198h40m-8-8l8 8-8 8" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="n" style="animation-delay:3.4s">
      <rect class="pulse" x="522" y="164" width="180" height="68" rx="16" fill="#2a1a14" stroke="#D97757" stroke-width="2"/>
      <circle cx="572" cy="188" r="6" fill="#D97757"/><path d="M560 210c0-9 5-13 12-13s12 4 12 13z" fill="#D97757"/>
      <text x="651" y="205" class="ac" font-weight="700">approve</text>
    </g>
    <path class="n" style="animation-delay:3.6s" d="M708 198h40m-8-8l8 8-8 8" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="n" style="animation-delay:3.8s"><rect x="753" y="164" width="180" height="68" rx="16" fill="#161b22" stroke="#30363d"/><text x="843" y="205" class="fg">implement</text></g>
    <path class="n" style="animation-delay:4.0s" d="M939 198h40m-8-8l8 8-8 8" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="n" style="animation-delay:4.2s"><rect x="984" y="164" width="156" height="68" rx="16" fill="#161b22" stroke="#30363d"/><text x="1062" y="205" class="fg">review</text></g>
  </g>

  <!-- principles -->
  <rect x="44" y="620" width="544" height="140" rx="18" fill="#161b22" stroke="#30363d"/>
  <text x="74" y="664" font-size="23" font-weight="700" class="fg"><tspan class="ac">01</tspan>  계획을 먼저 공격</text>
  <text x="74" y="704" font-size="19" class="dim">구현 전에 비판 에이전트가 계획의 빈틈을 찾고,</text>
  <text x="74" y="734" font-size="19" class="dim">사람이 승인해야 구현이 시작됩니다.</text>
  <rect x="612" y="620" width="544" height="140" rx="18" fill="#161b22" stroke="#30363d"/>
  <text x="642" y="664" font-size="23" font-weight="700" class="fg"><tspan class="ac">02</tspan>  훅으로 강제</text>
  <text x="642" y="704" font-size="19" class="dim">파일을 고치면 관련 테스트가 바로 돌고,</text>
  <text x="642" y="734" font-size="19" class="dim">전체 테스트가 통과하기 전엔 작업이 끝나지 않습니다.</text>
</svg>
